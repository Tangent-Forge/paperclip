global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - alerts/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: paperclip-host
    static_configs:
      - targets:
          - localhost:9100
        labels:
          plane: tf-hub-wsl

  - job_name: paperclip-containers
    static_configs:
      - targets:
          - localhost:9101
        labels:
          plane: tf-hub-wsl

  - job_name: paperclip-edge
    metrics_path: /api/health/metrics
    static_configs:
      - targets:
          - localhost:3100
        labels:
          plane: tf-hub-wsl

  - job_name: cloudflared
    static_configs:
      - targets:
          - localhost:20241
        labels:
          plane: tf-hub-wsl

  - job_name: caddy
    metrics_path: /metrics
    static_configs:
      - targets:
          - localhost:2019
        labels:
          plane: tf-hub-wsl

  - job_name: paperclip-service-probes
    metrics_path: /probe
    params:
      module:
        - http_2xx
    static_configs:
      - targets:
          - http://localhost:8642/health
        labels:
          service: hermes
      - targets:
          - http://localhost:3131/health
        labels:
          service: gbrain
      - targets:
          - http://localhost:3000/
        labels:
          service: openwebui
      - targets:
          - http://localhost:11434/
        labels:
          service: ollama
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: instance
      - target_label: __address__
        replacement: localhost:9115
