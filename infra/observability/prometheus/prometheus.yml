# Repo-controlled scrape plan for Paperclip control-plane metrics.
#
# This file is intentionally observe-only. It documents private loopback targets
# for an operator-run Prometheus and does not open ports, change auth, restart
# services, or embed secrets.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    service_group: paperclip-control-plane

scrape_configs:
  - job_name: paperclip-service
    metrics_path: /api/health/metrics
    static_configs:
      - targets:
          - 127.0.0.1:3100
        labels:
          component: paperclip
          collection_path: paperclip-health-metrics

  - job_name: cloudflared
    metrics_path: /metrics
    static_configs:
      - targets:
          - 127.0.0.1:20241
        labels:
          component: cloudflared
          collection_path: cloudflared-metrics-listener

  - job_name: caddy
    metrics_path: /metrics
    static_configs:
      - targets:
          - 127.0.0.1:2019
        labels:
          component: caddy
          collection_path: caddy-admin-metrics

  - job_name: gbrain
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://127.0.0.1:3131/health
        labels:
          component: gbrain
          collection_path: blackbox-http
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115

  - job_name: openwebui
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://127.0.0.1:3000
        labels:
          component: openwebui
          collection_path: blackbox-http
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115

  - job_name: ollama
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - 127.0.0.1:11434
        labels:
          component: ollama
          collection_path: blackbox-tcp
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115

  - job_name: hermes
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - 127.0.0.1:8642
          - 127.0.0.1:3978
        labels:
          component: hermes
          collection_path: blackbox-tcp
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115
