# Docker Compose scrape plan for infra/observability/docker-compose.lgtm.yml.
#
# Prometheus runs inside a container, so host services are reached through
# host.docker.internal. Published stack ports remain bound to 127.0.0.1.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    service_group: paperclip-control-plane
    stack: docker-lgtm

scrape_configs:
  - job_name: paperclip-service
    metrics_path: /api/health/metrics
    static_configs:
      - targets:
          - host.docker.internal:3100
        labels:
          component: paperclip
          collection_path: paperclip-health-metrics

  - job_name: cloudflared
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:20241
        labels:
          component: cloudflared
          collection_path: cloudflared-metrics-listener

  - job_name: caddy
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:2019
        labels:
          component: caddy
          collection_path: caddy-admin-metrics

  - job_name: gbrain
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://host.docker.internal:3131/health
        labels:
          component: gbrain
          collection_path: blackbox-http
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: openwebui
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://host.docker.internal:3000
        labels:
          component: openwebui
          collection_path: blackbox-http
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: ollama
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - host.docker.internal:11434
        labels:
          component: ollama
          collection_path: blackbox-tcp
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: hermes
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - host.docker.internal:8642
          - host.docker.internal:3978
        labels:
          component: hermes
          collection_path: blackbox-tcp
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
