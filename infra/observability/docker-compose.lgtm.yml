# Loopback-only Grafana LGTM stack for local Paperclip observability.
#
# Start from the repo root:
#   docker compose -f infra/observability/docker-compose.lgtm.yml up -d
#
# Public host ports are intentionally bound to 127.0.0.1 only.
services:
  grafana:
    image: grafana/grafana:12.2.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PAPERCLIP_OBS_GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SERVER_HTTP_ADDR: "0.0.0.0"
      GF_SERVER_HTTP_PORT: "3000"
      GF_SECURITY_ADMIN_USER: "${PAPERCLIP_OBS_GRAFANA_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${PAPERCLIP_OBS_GRAFANA_PASSWORD:-paperclip}"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_DEFAULT_THEME: "system"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
      - tempo

  prometheus:
    image: prom/prometheus:v3.7.3
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PAPERCLIP_OBS_PROMETHEUS_RETENTION:-7d}"
      - "--web.enable-lifecycle"
      - "--web.listen-address=0.0.0.0:9090"
    ports:
      - "127.0.0.1:${PAPERCLIP_OBS_PROMETHEUS_PORT:-9090}:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - prometheus-data:/prometheus
      - ./prometheus/docker-prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - blackbox

  loki:
    image: grafana/loki:3.5.8
    restart: unless-stopped
    command:
      - "-config.file=/etc/loki/local-config.yml"
    ports:
      - "127.0.0.1:${PAPERCLIP_OBS_LOKI_PORT:-3101}:3100"
    volumes:
      - loki-data:/loki
      - ./loki/local-config.yml:/etc/loki/local-config.yml:ro

  tempo:
    image: grafana/tempo:2.9.0
    restart: unless-stopped
    command:
      - "-config.file=/etc/tempo/tempo.yml"
    ports:
      - "127.0.0.1:${PAPERCLIP_OBS_TEMPO_PORT:-3200}:3200"
      - "127.0.0.1:${PAPERCLIP_OBS_OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${PAPERCLIP_OBS_OTLP_HTTP_PORT:-4318}:4318"
    volumes:
      - tempo-data:/var/tempo
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro

  blackbox:
    image: prom/blackbox-exporter:v0.27.0
    restart: unless-stopped
    command:
      - "--config.file=/etc/blackbox_exporter/config.yml"
      - "--web.listen-address=0.0.0.0:9115"
    ports:
      - "127.0.0.1:${PAPERCLIP_OBS_BLACKBOX_PORT:-9115}:9115"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus/blackbox.yml:/etc/blackbox_exporter/config.yml:ro

volumes:
  grafana-data:
  prometheus-data:
  loki-data:
  tempo-data:
