apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    uid: paperclip-prometheus
    isDefault: true
    editable: true

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    uid: paperclip-loki
    editable: true

  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    uid: paperclip-tempo
    editable: true
    jsonData:
      tracesToLogsV2:
        datasourceUid: paperclip-loki
      tracesToMetrics:
        datasourceUid: paperclip-prometheus
      serviceMap:
        datasourceUid: paperclip-prometheus
