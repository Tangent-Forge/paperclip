name: Upstream Sync

on:
  schedule:
    # Mondays 14:00 UTC = 09:00 America/Chicago (Central)
    - cron: "0 14 * * 1"
  workflow_dispatch:

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git identity
        run: |
          git config user.name "gh-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote and fetch
        run: |
          git remote add upstream https://github.com/paperclipai/paperclip.git
          git fetch upstream master

      - name: Check for upstream commits to sync
        id: check
        run: |
          count="$(git rev-list --count master..upstream/master)"
          echo "commit_count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -eq 0 ]; then
            echo "Nothing to sync."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "$count upstream commit(s) to sync."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute branch name
        id: branch
        if: steps.check.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE="$(date -u +%Y-%m-%d)"
          BASE="chore/upstream-sync-${DATE}"
          BRANCH="$BASE"
          # If a branch with that name already exists on origin, append a rerun suffix
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            BRANCH="${BASE}-rerun-$(date -u +%H%M)"
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "Using branch: $BRANCH"

      - name: Create branch and attempt merge
        id: merge
        if: steps.check.outputs.has_changes == 'true'
        run: |
          BRANCH="${{ steps.branch.outputs.branch }}"
          git checkout -b "$BRANCH" master
          if git merge --no-ff --no-edit upstream/master; then
            echo "sync_status=clean" >> "$GITHUB_OUTPUT"
            echo "Merge succeeded cleanly."
          else
            git diff --name-only --diff-filter=U > /tmp/conflicts.txt || true
            git merge --abort || true
            # Create a placeholder commit on the branch documenting the conflict
            # so we still have something to PR for human resolution.
            echo "Merge conflicts encountered; aborted merge. Recording conflict list."
            echo "sync_status=conflicts" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.merge.outputs.sync_status == 'clean'
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - name: Setup Node.js
        if: steps.merge.outputs.sync_status == 'clean'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Refresh pnpm lockfile
        id: lockfile
        if: steps.merge.outputs.sync_status == 'clean'
        run: |
          pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile unchanged."
            echo "lockfile_changed=false" >> "$GITHUB_OUTPUT"
          else
            git add pnpm-lock.yaml
            git commit --amend --no-edit
            echo "Lockfile updated and amended into merge commit."
            echo "lockfile_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push branch
        if: steps.check.outputs.has_changes == 'true'
        run: |
          BRANCH="${{ steps.branch.outputs.branch }}"
          if [ "${{ steps.merge.outputs.sync_status }}" = "conflicts" ]; then
            # For conflict case, branch is currently at master HEAD (merge was aborted).
            # Push an empty branch off master so reviewers can use it as a workspace.
            git push origin "HEAD:refs/heads/$BRANCH"
          else
            git push origin "$BRANCH"
          fi

      - name: Build PR body
        id: body
        if: steps.check.outputs.has_changes == 'true'
        env:
          SYNC_STATUS: ${{ steps.merge.outputs.sync_status }}
          LOCKFILE_CHANGED: ${{ steps.lockfile.outputs.lockfile_changed }}
          COMMIT_COUNT: ${{ steps.check.outputs.commit_count }}
          SYNC_DATE: ${{ steps.branch.outputs.date }}
        run: |
          {
            echo "## Thinking Path"
            echo
            echo "> - Paperclip orchestrates AI agents for zero-human companies"
            echo "> - The Tangent Forge fork tracks upstream paperclipai/paperclip"
            echo "> - Upstream evolves continuously; the fork needs a low-friction sync cadence"
            echo "> - A weekly automated merge surfaces drift early instead of compounding"
            echo "> - This pull request merges \`upstream/master\` into the fork's \`master\`"
            echo "> - The benefit is predictable, reviewable upstream ingestion with conflict isolation"
            echo
            echo "## What Changed"
            echo
            echo "- Merged \`upstream/master\` into fork (\`$COMMIT_COUNT\` commit(s)) on \`$SYNC_DATE\`"
            if [ "$LOCKFILE_CHANGED" = "true" ]; then
              echo "- Refreshed \`pnpm-lock.yaml\` to match upstream manifest changes"
            else
              echo "- \`pnpm-lock.yaml\` unchanged"
            fi
            if [ "$SYNC_STATUS" = "conflicts" ]; then
              echo "- **Merge conflicts** — automated merge was aborted; human resolution required"
            fi
            echo
            echo "### Upstream commits"
            echo
            echo '```'
            git log --no-merges --pretty=format:'%h %s' master..upstream/master | head -n 30
            extra="$(git log --no-merges --pretty=format:'%h' master..upstream/master | tail -n +31 | wc -l | tr -d ' ')"
            echo
            if [ "$extra" -gt 0 ]; then
              echo "...and $extra more"
            fi
            echo '```'
            echo
            if [ "$SYNC_STATUS" = "conflicts" ] && [ -s /tmp/conflicts.txt ]; then
              echo "### Conflicting files"
              echo
              echo '```'
              cat /tmp/conflicts.txt
              echo '```'
              echo
            fi
            echo "## Verification"
            echo
            echo "- Test gate runs via \`pr.yml\` once this PR is open"
            echo "- Reviewer should confirm no surprising behavioral shifts in changed subsystems"
            if [ "$SYNC_STATUS" = "conflicts" ]; then
              echo "- **Required:** resolve conflicts locally with \`scripts/sync-upstream.sh\` or manual merge"
            fi
            echo
            echo "## Risks"
            echo
            if [ "$SYNC_STATUS" = "conflicts" ]; then
              echo "- Merge conflicts present; do not land until resolved"
            else
              echo "- Standard upstream-merge risk: behavioral drift in dependencies or shared modules"
            fi
            echo
            echo "## Model Used"
            echo
            echo "- None — automated GitHub Actions workflow (\`.github/workflows/upstream-sync.yml\`)"
          } > /tmp/body.md
          echo "Wrote PR body to /tmp/body.md ($(wc -l < /tmp/body.md) lines)"

      - name: Create pull request
        id: pr
        if: steps.check.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="${{ steps.branch.outputs.branch }}"
          DATE="${{ steps.branch.outputs.date }}"
          # --repo is required: this repository is a fork of paperclipai/paperclip,
          # and `gh pr create` defaults the base repository to the fork's parent.
          # Without it the call targets paperclipai/paperclip, which this token
          # cannot write to, and fails with
          # "GraphQL: Resource not accessible by integration (createPullRequest)".
          pr_url="$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base master \
            --head "$BRANCH" \
            --title "chore: sync upstream ($DATE)" \
            --body-file /tmp/body.md)"
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "Created PR: $pr_url"

      - name: Label PR (conflicts)
        if: steps.merge.outputs.sync_status == 'conflicts' && steps.pr.outputs.pr_url != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr edit "${{ steps.pr.outputs.pr_url }}" \
            --add-label "needs-review" \
            --add-label "upstream-sync" \
            --add-label "conflicts"

      - name: Label PR (clean)
        if: steps.merge.outputs.sync_status == 'clean' && steps.pr.outputs.pr_url != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr edit "${{ steps.pr.outputs.pr_url }}" \
            --add-label "upstream-sync"
