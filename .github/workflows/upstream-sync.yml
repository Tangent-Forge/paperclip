name: Upstream Review

on:
  schedule:
    # First Monday, 15:00 UTC (09:00 CST / 10:00 CDT). The report itself is
    # evidence only; the Paperclip review task is the America/Chicago schedule.
    - cron: "0 15 1-7 * 1"
  workflow_dispatch:

concurrency:
  group: upstream-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch upstream for comparison
        run: |
          git remote add upstream https://github.com/paperclipai/paperclip.git
          git fetch --no-tags upstream master

      - name: Build read-only upstream review
        run: |
          mkdir -p upstream-review
          upstream_only="$(git rev-list --count master..upstream/master)"
          fork_only="$(git rev-list --count upstream/master..master)"
          base="$(git merge-base master upstream/master)"
          cat > upstream-review/report.md <<EOF
          # Paperclip upstream review

          - Generated: $(date -u +%FT%TZ)
          - Fork baseline: $(git rev-parse master)
          - Upstream baseline: $(git rev-parse upstream/master)
          - Common ancestor: $base
          - Upstream-only commits: $upstream_only
          - Fork-only commits: $fork_only

          ## Required human decision

          This workflow does not merge, push, or create a pull request. Review
          the next batch (maximum 100 commits or one coherent release train) in
          an owner-approved implementation session.

          ## First 100 upstream commits

          \`\`\`
          $(git log --no-merges --pretty=format:'%h %s' master..upstream/master | head -n 100)
          \`\`\`
          EOF

      - name: Upload upstream review evidence
        uses: actions/upload-artifact@v4
        with:
          name: paperclip-upstream-review-${{ github.run_id }}
          path: upstream-review/report.md
          if-no-files-found: error
